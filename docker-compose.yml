services:
  postgres:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    user: 1000:1000
    volumes:
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db

  backend:
    build:
      context: ./backend
      secrets:
        - extra_ca
    restart: unless-stopped
    # No published ports: only reachable by the frontend over the "web" network
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      REMEMBER_ME_TOKEN_EXPIRE_DAYS: ${REMEMBER_ME_TOKEN_EXPIRE_DAYS:-30}
      # Must include the public URL users open (your Cloudflare Tunnel hostname),
      # otherwise WebSocket connections are rejected
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8000
      UPLOAD_DIR: /app/uploads
      DEBUG: ${DEBUG:-false}
      MAX_MESSAGES_PER_CONVERSATION: ${MAX_MESSAGES_PER_CONVERSATION:-1000}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - go_uploads:/app/uploads
      - ./backend/app:/app/app
    networks:
      - db
      - web

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-/ws}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}
      secrets:
        - extra_ca
    restart: unless-stopped
    # The only published port. Bound to localhost by default so it is reachable
    # by cloudflared on this host but not from the network directly.
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      - backend
    networks:
      - web

networks:
  # Postgres <-> backend only; no outbound internet access
  db:
    internal: true
  # Frontend <-> backend; backend also needs outbound access for web push
  web:

secrets:
  # Optional root CA for building behind TLS-intercepting proxies (e.g. Zscaler).
  # Set EXTRA_CA_FILE in .env; when unset, an empty file is used and ignored.
  extra_ca:
    file: ${EXTRA_CA_FILE:-/dev/null}

volumes:
  postgres_data:
  go_uploads:
