# nginx config for the frontend container (see frontend/Dockerfile).
# Serves the built SPA and reverse-proxies the backend over the internal
# Docker network. TLS is terminated upstream (e.g. Cloudflare Tunnel), so
# this listens on plain HTTP. For a host-level nginx deployment with
# Let's Encrypt, see ../nginx.conf and deployment.md instead.

# Real client IP: Cloudflare puts the visitor IP in CF-Connecting-IP.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Original scheme: cloudflared forwards X-Forwarded-Proto (https).
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# Only send "Connection: upgrade" for WebSocket requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Hashed Vite build assets are immutable; everything else is revalidated.
# Empty value = header not added (proxied backend responses keep their own).
map $uri $cache_control {
    "~^/(api|ws|app)(/|$)"                        "";
    "~^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$"    "public, max-age=31536000, immutable";
    default                                       "no-cache";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Matches the backend's 50MB upload limit
    client_max_body_size 51M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security response headers (SECURITY_HARDENING.md items 2 and 8); same set
    # as ../nginx.conf. Server-level so every location inherits them -- do not
    # add an add_header inside a location{} block, that drops all of these.
    # HSTS is ignored by browsers over plain-HTTP (local) access and applies
    # once served over HTTPS via Cloudflare.
    add_header Cache-Control $cache_control always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;

    # Resolve "backend" via Docker's embedded DNS at request time, so nginx
    # keeps working when the backend container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite every header chi's middleware.RealIP reads (True-Client-IP first,
    # then X-Real-IP, then X-Forwarded-For) so clients cannot forge their IP and
    # dodge the per-IP auth rate limit.
    proxy_set_header True-Client-IP $client_ip;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /api/ {
        proxy_pass $backend;
    }

    location /ws {
        proxy_pass $backend;
        # Backend pings every 30s; this is just an upper bound for idle sockets
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Static app downloads (APK, etc.) served by the backend
    location /app/ {
        proxy_pass $backend;
    }

    # This nginx image has no built-in .webmanifest MIME mapping.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # SPA: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
